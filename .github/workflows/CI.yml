name: CI

on: [ push, pull_request ]

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      GRADLE_OPTS: "-Dfile:encoding=UTF-8"

    steps:
      - name: Cache glslang
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/runelite
          key: ${{ runner.os }}-cache-${{ hashFiles('ci/build.sh') }}
          restore-keys: |
            ${{ runner.os }}-cache-

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Install Rust Android targets
        run: |
          rustup target add \
            armv7-linux-androideabi \
            aarch64-linux-android \
            x86_64-linux-android \
            i686-linux-android

      # The current injected client jar (data/runelite-1.13.0-…) is gitignored, so CI builds
      # against the older one committed in data/. That makes this a compile check only: the
      # APKs it produces won't work against the live game.
      - name: Build and Test
        run: ./ci/build.sh
        env:
          ORG_GRADLE_PROJECT_injectedClient: runelite-1.12.39-injected-35108282871.259

      # ci/build.sh skips tests; run the konkr flavor's JVM unit tests on their own.
      - name: Konkr unit tests
        run: ./gradlew --build-cache :android:testKonkrDebugUnitTest
        env:
          ORG_GRADLE_PROJECT_injectedClient: runelite-1.12.39-injected-35108282871.259

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: runelite-android-compilecheck-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            **/build/outputs/apk/**/debug/*.apk