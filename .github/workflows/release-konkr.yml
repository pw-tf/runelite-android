name: Release Konkr

# Builds the signed RuneLite (Konkr) release APK and publishes it as a GitHub Release.
# Starts when:
#   - a tag named konkr-* is pushed (the release uses that tag), e.g.
#       git tag konkr-1.13.0-1.0.29 main && git push origin konkr-1.13.0-1.0.29
#   - it's run by hand from the Actions tab (Run workflow)
#   - the upstream sync merges a new upstream version
#
# Every release must be signed with the same key, or Android refuses to install it over
# the previous one. The key comes from these repository secrets; the workflow stops if
# any are missing rather than publishing a debug-signed APK:
#   KONKR_KEYSTORE_BASE64   base64 of the .jks file
#   KONKR_KEYSTORE_PASSWORD keystore password
#   KONKR_KEY_ALIAS         key alias
#   KONKR_KEY_PASSWORD      key password

on:
  push:
    tags:
      - "konkr-*"
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to build (default main)
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-konkr
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04

    env:
      GRADLE_OPTS: "-Dfile.encoding=UTF-8"

    steps:
      - name: Check signing secrets
        env:
          KS: ${{ secrets.KONKR_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KONKR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KONKR_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KONKR_KEY_PASSWORD }}
        run: |
          missing=0
          for v in KS KS_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!v}" ]; then missing=1; fi
          done
          if [ "$missing" = 1 ]; then
            echo "::error::Release signing secrets are not set (KONKR_KEYSTORE_BASE64, KONKR_KEYSTORE_PASSWORD, KONKR_KEY_ALIAS, KONKR_KEY_PASSWORD)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || (github.event_name == 'push' && github.ref) || 'main' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Install Rust Android targets
        run: |
          rustup target add \
            armv7-linux-androideabi \
            aarch64-linux-android \
            x86_64-linux-android \
            i686-linux-android

      - name: Fetch injected client
        run: ./ci/fetch-injected-client.sh

      - name: Configure release signing
        env:
          KS: ${{ secrets.KONKR_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KONKR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KONKR_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KONKR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ks="$RUNNER_TEMP/konkr-release.jks"
          echo "$KS" | base64 -d > "$ks"
          {
            echo "runeliteMp.signing.storeFile=$ks"
            echo "runeliteMp.signing.storePassword=$KS_PASS"
            echo "runeliteMp.signing.keyAlias=$KEY_ALIAS"
            echo "runeliteMp.signing.keyPassword=$KEY_PASS"
          } >> local.properties

      - name: Test and build
        run: ./gradlew --build-cache :android:testKonkrDebugUnitTest :android:assembleKonkrRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rl=$(sed -n 's/^project\.build\.version=//p' gradle.properties)
          major=$(sed -n 's/^ *val versionMajor = \([0-9]*\).*/\1/p' android/build.gradle.kts)
          minor=$(sed -n 's/^ *val versionMinor = \([0-9]*\).*/\1/p' android/build.gradle.kts)
          patch=$(sed -n 's/^ *val versionPatch = \([0-9]*\).*/\1/p' android/build.gradle.kts)
          app="$major.$minor.$patch"
          sha=$(git rev-parse HEAD)

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # Started by pushing a konkr-* tag: publish under that tag.
            tag="$GITHUB_REF_NAME"
          else
            tag="konkr-${rl}-${app}"
          fi
          if [ "$GITHUB_EVENT_NAME" != "push" ] && gh release view "$tag" >/dev/null 2>&1; then
            # Same versions as an earlier release (an upstream fix without a version bump).
            tag="${tag}-r${GITHUB_RUN_NUMBER}"
          fi

          apk=$(ls android/build/outputs/apk/konkr/release/*.apk | head -n 1)
          out="RuneLite-Konkr-${rl}.apk"
          cp "$apk" "$out"

          cat > notes.md <<NOTES
          RuneLite (Konkr) for OSRS / RuneLite **${rl}** (app ${app}).

          Built from ${sha}.

          Download \`${out}\` on the device and install it over your existing RuneLite (Konkr) app.
          When OSRS updates and the game says the client is out of date, come back here for the next release.
          NOTES

          gh release create "$tag" "$out" \
            --target "$sha" \
            --title "Konkr ${rl} (app ${app})" \
            --notes-file notes.md \
            --latest
